[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twig"
version = "0.2.0"
description = "TWIG graph forecasting reproducibility package"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "h5py>=3.8", "matplotlib>=3.7", "numpy>=1.24", "pandas>=2.0",
  "tfrecord>=1.14", "PyWavelets>=1.4", "scipy>=1.10", "torch>=2.1", "torch-geometric>=2.4", "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# Optional legacy interactive plots; not needed for manuscript reproduction.
visualization = ["plotly>=5", "Jinja2>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
